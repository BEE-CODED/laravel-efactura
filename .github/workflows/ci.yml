name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # composer.json allows Laravel 12 and 13 but only one is ever installed
    # locally, so the matrix is the only thing that checks the range we advertise.
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12.*', '13.*']
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 13 is tested prefer-stable only: its prefer-lowest cannot resolve test
          # deps (pest 3.0 / phpunit 11) that predate it. Real 13.x installs run current
          # patches, which prefer-stable covers; Laravel 12 still runs a full prefer-lowest.
          - laravel: '13.*'
            dependency-version: prefer-lowest
          # The dependency floors predate PHP 8.5, so prefer-lowest runs on 8.4 only.
          - php: '8.5'
            dependency-version: prefer-lowest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          # Composer 2.8+ refuses to install security-advisory-flagged releases, and
          # prefer-lowest resolves the oldest framework patches we allow, which can carry
          # one. Unblock them for CI only (never shipped).
          composer config --global policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      # The suite runs against sqlite :memory:, hardcoded in tests/TestCase.php and
      # mirrored in phpunit.xml.dist. No external service required.
      - name: Tests
        run: vendor/bin/pest

  postgres:
    # The suite runs on sqlite :memory:, which never poisons a transaction on a
    # failed statement and gives each connection its own database. The
    # create/constraint race tests need the opposite on both counts, so they skip
    # on sqlite and run here against a real Postgres — this is the only job that
    # actually exercises queueFor()'s savepoint recovery inside a caller's
    # transaction. Without it that fix would be shipped unverified.
    name: Postgres (transaction poisoning)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: efactura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: efactura_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo_pgsql, pgsql
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      # Fail loudly if the race tests are skipped here — this job exists solely to
      # run them, so a skip means Postgres is not actually wired up.
      - name: Race tests must run (not skip) on Postgres
        run: |
          vendor/bin/pest --filter="create/constraint race" --log-junit junit.xml
          if grep -q '<skipped' junit.xml; then
            echo "::error::The create/constraint race tests skipped on the Postgres job — the DB is not wired up."
            exit 1
          fi
      - name: Full suite on Postgres
        run: vendor/bin/pest

  mariadb:
    # Hosts run MariaDB/MySQL too. REPEATABLE READ cannot see a race winner committed after the
    # caller's snapshot, so the create/constraint race tests skip here (see the README's
    # queueUpload() note); everything else, including migration 000008's data move, runs.
    name: MariaDB
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: efactura_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: efactura_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo_mysql
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - name: Full suite on MariaDB
        run: vendor/bin/pest

  redis:
    # Production hosts keep the refresh cooldown, locks and counters in Redis, which hands
    # values back as strings where the array store keeps ints. The refused-grant cooldown read
    # broke only on Redis (an is_int() check never matched), so the array-store jobs above
    # could not catch it. sqlite :memory: as in the main tests job; tests/TestCase.php gives
    # each test its own cache prefix on a non-array store.
    name: Redis cache
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CACHE_STORE: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      # phpredis (the extension below): predis is not a dev dependency of this package.
      REDIS_CLIENT: phpredis

    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite, redis
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - name: Full suite on the Redis cache store
        run: vendor/bin/pest

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      # Keep this honest: an ignoreErrors entry is exactly how the message-sync
      # bug (reading a property the SDK never declared) stayed hidden.
      - run: vendor/bin/phpstan analyse --no-progress

  code-style:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pint --test

  mcp:
    name: MCP server (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npx vitest run
        working-directory: mcp
      - run: npm run typecheck
        working-directory: mcp
      # dist/index.js is committed and shipped to consumers. If it drifts from
      # src/, users run a reader that does not match this release.
      - name: Verify committed bundle matches src
        working-directory: mcp
        run: |
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::mcp/dist is stale — run 'npm run build' in mcp/ and commit the result."
            git diff --stat -- dist/
            exit 1
          fi
